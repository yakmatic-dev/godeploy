name: Go CI/CD with PM2

on:
  push:
    branches: [ "dev" ]

env:
  APP_NAME: gopher-social
  GO_VERSION: "1.22"
  DEPLOY_DIR: /opt/apps/gopher-social
  BINARY_NAME: app

jobs:

  # =========================
  # 1. TEST
  # =========================
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install deps
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

  # =========================
  # 2. BUILD
  # =========================
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o dist/${BINARY_NAME} ./cmd/api

      - name: Package
        run: |
          tar -czf ${APP_NAME}.tar.gz -C dist ${BINARY_NAME}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app
          path: ${APP_NAME}.tar.gz

  # =========================
  # 3. DEPLOY WITH PM2
  # =========================
  deploy:
    name: Deploy to Server (PM2)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: go-app

      - name: Copy Artifact to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "${APP_NAME}.tar.gz"
          target: "/tmp"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "Creating deploy directory..."
            sudo mkdir -p ${DEPLOY_DIR}

            echo "Extracting artifact..."
            sudo tar -xzf /tmp/${APP_NAME}.tar.gz -C ${DEPLOY_DIR}

            echo "Setting permissions..."
            sudo chmod +x ${DEPLOY_DIR}/${BINARY_NAME}
            sudo chown -R ${USER}:${USER} ${DEPLOY_DIR}

            echo "Stopping existing PM2 process..."
            pm2 delete ${APP_NAME} || true

            echo "Starting new version..."
            # PORT=8080 \
            # DB_USER=${{ secrets.DB_USER }} \
            # DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            # DB_HOST=${{ secrets.DB_HOST }} \
            # DB_NAME=${{ secrets.DB_NAME }} \
            pm2 start ${DEPLOY_DIR}/${BINARY_NAME} --name ${APP_NAME}

            echo "Saving PM2..."
            pm2 save

            echo "Deployment complete"
            pm2 status
