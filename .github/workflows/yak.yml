name: Go CI/CD with PM2.

on:
  push:
    branches: [ "dev" ]

env:
  APP_NAME: gopher-social
  GO_VERSION: "1.22"
  DEPLOY_DIR: /opt/apps/gopher-social
  BINARY_NAME: app

jobs:

  # =========================
  # 1. TEST
  # =========================
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install deps
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v


  # =========================
  # 2. BUILD
  # =========================
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Build binary (stable output path)
      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o dist/${{ env.BINARY_NAME }} ./cmd/api

      # Package artifact (fixed name)
      - name: Create archive
        run: |
          tar -czf go-app.tar.gz -C dist ${{ env.BINARY_NAME }}

      # Upload artifact (stable name)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app
          path: go-app.tar.gz


  # =========================
  # 3. DEPLOY (PM2)
  # =========================
  deploy:
    name: Deploy to Server (PM2)
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Download artifact
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: go-app

      # Verify download
      - name: Debug files
        run: ls -lh

      # Set known filename
      - name: Set artifact filename
        run: echo "FILE=go-app.tar.gz" >> $GITHUB_ENV

      # Copy to server
      - name: Copy Artifact to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "go-app.tar.gz"
          target: "/tmp"

      # Deploy via SSH + PM2
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "Creating deploy directory..."
            sudo mkdir -p ${{ env.DEPLOY_DIR }}

            echo "Extracting artifact..."
            sudo tar -xzf /tmp/go-app.tar.gz -C ${{ env.DEPLOY_DIR }}

            echo "Setting permissions..."
            sudo chmod +x ${{ env.DEPLOY_DIR }}/${{ env.BINARY_NAME }}
            sudo chown -R $USER:$USER ${{ env.DEPLOY_DIR }}

            echo "Starting or restarting PM2..."
            if pm2 describe ${{ env.APP_NAME }} > /dev/null 2>&1; then
              pm2 restart ${{ env.APP_NAME }}
            else
              pm2 start ${{ env.DEPLOY_DIR }}/${{ env.BINARY_NAME }} --name ${{ env.APP_NAME }}
            fi

            pm2 save
            pm2 status
